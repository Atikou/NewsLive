      });

      window.addEventListener("scroll", () => topBtn.classList.toggle("show", window.scrollY > 260));

      updatedEl.textContent = `最近检查：${formatTime(data.checkedAt || data.generatedAt)}`;
      render();
    </script>
  </body>
</html>
