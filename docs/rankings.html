      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      function safeUrl(value) {

          return url.protocol === "https:" ? url.href : "#";
        } catch {

        }

        const date = new Date(value || "");

        return date.toLocaleString("zh-CN", { hour12: false });

      function movement(item) {
