      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      function safeUrl(value) {

          return url.protocol === "https:" ? url.href : "#";
        } catch {

        }

      function formatTime(value) {

      function movement(item) {
        if (item.isNew) return '<span class="rank-change new">新</span>';
