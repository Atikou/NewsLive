      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function safeUrl(value) {
        try {
          const url = new URL(String(value || ""));
          return url.protocol === "https:" ? url.href : "#";
        } catch {
          return "#";
        }

      function formatTime(value) {
        const date = new Date(value || "");

      function movement(item) {
