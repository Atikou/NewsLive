        window.scrollTo({ top: 0, behavior: "smooth" });
      });
      window.addEventListener("scroll", () => {
        topBtn.classList.toggle("show", window.scrollY > 240);
      });
      renderFacetPanel();
      renderStatus();
      renderHealthPanel();
      renderLayout();
      renderList();
    </script>
  </body>
</html>
