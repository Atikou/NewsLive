name: NewsLive Pages

on:
  workflow_dispatch:
  schedule:
    # 避开整点高峰；GitHub schedule 仍可能延迟，不保证准点。
    - cron: "7,37 * * * *"
    # 每天北京时间 03:17 清理默认分支上超过 30 天的 Git 提交。
    - cron: "17 19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "newslive-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event.schedule != '17 19 * * *'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pages content
        env:
          # 推送 URL 包含设备 key/topic，只从 Secrets 注入。
          DAY_APP_PUSH_URL: ${{ secrets.DAY_APP_PUSH_URL }}
          NTFY_PUSH_URL: ${{ secrets.NTFY_PUSH_URL }}
          NTFY_BEARER_TOKEN: ${{ secrets.NTFY_BEARER_TOKEN }}
          NEWS_TIMEZONE: ${{ vars.NEWS_TIMEZONE }}
          # 默认 Google；需要 DeepSeek 时将仓库变量设置为 deepseek。
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_URL: ${{ secrets.DEEPSEEK_API_URL || vars.DEEPSEEK_API_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL || vars.DEEPSEEK_MODEL }}
          DEEPSEEK_THINKING_MODE: ${{ secrets.DEEPSEEK_THINKING_MODE || vars.DEEPSEEK_THINKING_MODE }}
          AI_API_FORMAT: ${{ secrets.AI_API_FORMAT || vars.AI_API_FORMAT }}
          # 兼容已有部署，迁移到 DEEPSEEK_* 后可删除旧 Secrets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_URL: ${{ secrets.ANTHROPIC_API_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: npm run build:pages

      - name: Commit updated crawl data
        run: |
          if [ -n "$(git status --porcelain docs data/news-days.json data/news-archive.json data/push-queue.json data/push-delivery.json data/rankings.json)" ]; then
            git add docs data/news-days.json data/news-archive.json data/push-queue.json data/push-delivery.json data/rankings.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update pages crawl output"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  prune-history:
    needs: build-and-deploy
    if: >-
      ${{ !cancelled() &&
          (needs.build-and-deploy.result == 'success' || needs.build-and-deploy.result == 'skipped') &&
          (github.event.schedule == '17 19 * * *' || github.event_name == 'workflow_dispatch') &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout latest default branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Keep the last 30 days of commits
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/prune-history.js --push "$DEFAULT_BRANCH"
